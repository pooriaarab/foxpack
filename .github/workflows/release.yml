# main = staging, release = production.
# Merge main into release to publish the version in package.json to npm.
#
# check builds once and passes the build on as an artifact. e2e runs the
# Firefox E2E on that build on Ichabod. Only then npm publishes the packed
# tarball, without an install, and amo submits dist-ext/. Each job asks
# for its own permissions (docs/failure-modes.md R1-R4).
name: Release

on:
  push:
    branches: [release]

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      name: ${{ steps.meta.outputs.name }}
      version: ${{ steps.meta.outputs.version }}
      slug: ${{ steps.meta.outputs.slug }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Refuse a version that is already released
        id: meta
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ -n "$(git ls-remote --tags origin "refs/tags/v${VERSION}")" ]; then
            echo "::error::Version ${VERSION} is already released. Bump the version in package.json."
            exit 1
          fi
          {
            echo "name=$(node -p "require('./package.json').name")"
            echo "version=${VERSION}"
            echo "slug=$(node -p "require('./extension/amo-metadata.json').slug")"
          } >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm ci:local
      - name: Pack the release build
        run: |
          mkdir release
          npm pack --pack-destination release
          # AMO reviewers get the source, because dist-ext/ is bundled.
          git archive --format=zip -o release/source.zip HEAD
          cp -R dist dist-ext release/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: release/
          if-no-files-found: error

  e2e:
    needs: [check]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      - name: Install cloudflared, checked by its sha256
        run: |
          curl -fsSL -o "$RUNNER_TEMP/cloudflared" https://github.com/cloudflare/cloudflared/releases/download/2026.10.0/cloudflared-linux-amd64
          echo "d33ff2d14475178d2012c2c56beba87389ac5ded27649519f198a7d3134a99db  $RUNNER_TEMP/cloudflared" | sha256sum -c
          chmod +x "$RUNNER_TEMP/cloudflared"
      - name: Run the Firefox E2E on Ichabod, on the release build
        env:
          FOXKIT_BROWSER: ichabod
          ICHABOD_API_KEY: ${{ secrets.ICHABOD_API_KEY }}
        run: |
          if [ -z "$ICHABOD_API_KEY" ]; then
            echo "::error::Secret ICHABOD_API_KEY is empty. Add the Ichabod API key as the repository secret ICHABOD_API_KEY."
            exit 1
          fi
          rm -rf dist dist-ext
          mv release/dist release/dist-ext .
          CLOUDFLARED="$RUNNER_TEMP/cloudflared" node e2e/run.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: e2e
          path: artifacts/

  npm:
    needs: [check, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      - name: Publish the packed tarball to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PKG: ${{ needs.check.outputs.name }}
          VER: ${{ needs.check.outputs.version }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::Secret NPM_TOKEN is empty. Add an npm automation token as the repository secret NPM_TOKEN, then push to release again."
            exit 1
          fi
          TARBALL="release/${PKG}-${VER}.tgz"
          if npm view "$PKG@$VER" version >/dev/null 2>&1; then
            echo "$PKG@$VER is already on npm. Skipping publish so the AMO job can run."
          else
            npm publish "$TARBALL" --provenance --access public
          fi

  amo:
    needs: [check, e2e, npm]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      review-url: ${{ steps.submit.outputs.review-url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      # web-ext only; no install script runs, and no secret is in this step.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      - name: Submit the extension to AMO as a listed add-on
        id: submit
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          missing=0
          for name in AMO_JWT_ISSUER AMO_JWT_SECRET; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is empty. Add your AMO API key as repository secrets AMO_JWT_ISSUER and AMO_JWT_SECRET."
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
          rm -rf dist-ext
          mv release/dist-ext .
          node scripts/amo-listing.mjs check
          # A re-run after a later step failed must not submit the same
          # version again: AMO refuses a version number it already has.
          STATUS=$(node scripts/amo-listing.mjs version-status)
          if [ "${STATUS%% *}" = "listed" ]; then
            echo "AMO already has this version as listed. Skipping web-ext sign."
            REVIEW_URL=$(echo "${STATUS#listed}" | tr -d ' ')
          else
            node scripts/amo-listing.mjs metadata "$RUNNER_TEMP/amo-metadata.json"
            # A listed version waits for AMO review, which can take days. With
            # --approval-timeout=0, web-ext returns after AMO accepts the
            # upload, the listing and the source, and it downloads no signed
            # file (web-ext 10, lib/util/submit-addon.js, doAfterSubmit). AMO
            # publishes the signed file on the listing page after approval.
            pnpm exec web-ext sign -s dist-ext -a web-ext-artifacts --channel=listed \
              --amo-metadata "$RUNNER_TEMP/amo-metadata.json" --approval-timeout=0 \
              --api-key="$AMO_JWT_ISSUER" --api-secret="$AMO_JWT_SECRET" \
              --upload-source-code release/source.zip 2>&1 | tee "$RUNNER_TEMP/sign.log"
            if ! grep -q "Waiting for approval and download of signed XPI skipped" "$RUNNER_TEMP/sign.log"; then
              echo "::error::web-ext did not confirm the listed submission. Read the web-ext log above."
              exit 1
            fi
            REVIEW_URL=$(sed -n 's/.*can be downloaded from \([^ ]*\).*/\1/p' "$RUNNER_TEMP/sign.log" | tail -1)
          fi
          echo "review-url=${REVIEW_URL}" >> "$GITHUB_OUTPUT"
          # The privacy policy and the listing icon have their own AMO endpoints.
          node scripts/amo-listing.mjs after-submit

  github-release:
    needs: [check, amo]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # push the tag and create the GitHub release
    steps:
      - name: Tag and create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
          SLUG: ${{ needs.check.outputs.slug }}
          REVIEW_URL: ${{ needs.amo.outputs.review-url }}
        run: |
          # --notes goes before the generated notes.
          NOTES=(--notes "Submitted for AMO review as a listed add-on. After approval, install it from https://addons.mozilla.org/firefox/addon/${SLUG}/ (review status for the authors: ${REVIEW_URL:-the AMO Developer Hub}).")
          # gh creates the tag v<version> on this commit when it does not exist.
          gh release create "v${VERSION}" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "v${VERSION}" --generate-notes "${NOTES[@]}"
